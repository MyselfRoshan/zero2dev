name: release

# Merging into the `release` branch publishes the version in VERSION:
#
#   1. plan     reads VERSION, checks CHANGELOG.md and the other version strings, and looks
#               for the tag v<VERSION>. If it already exists there is nothing to release and
#               the run stops there (a notice says so); nothing fails.
#   2. test     the whole ci workflow (web, go on Linux and Windows, e2e). Any failure stops
#               the release: no tag, no release.
#   3. build    the Windows executable, the zip, the checksum file, the notes, the attestation.
#   4. publish  creates the tag v<VERSION> on the merged commit and the GitHub release.
#
# To release:  scripts/bump-version.sh 0.0.5, write the CHANGELOG.md section, open a pull
#              request into `release` (ci checks that the version is new), merge it.
# Dry run:     Actions tab -> release -> Run workflow. Runs plan, test and build and keeps the
#              files as a workflow artifact; nothing is tagged or released.

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION, CHANGELOG.md and the tag
        id: check
        run: bash scripts/release-check.sh | tee -a "$GITHUB_OUTPUT"
      - name: Decide
        id: decide
        env:
          VERSION: ${{ steps.check.outputs.version }}
          RELEASED: ${{ steps.check.outputs.released }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Dry run of ${VERSION}: build only, nothing is tagged or released."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASED" == "true" ]]; then
            echo "::notice::v${VERSION} is already released, so this merge publishes nothing. Bump VERSION (scripts/bump-version.sh) to release again."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v${VERSION}."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [plan, test]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # The dashboard the ci run built and tested is the one that is embedded.
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist

      - name: Build the Windows executable
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist/stage
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" -o dist/stage/zero2dev.exe ./cmd/zero2dev

      - name: Package and checksum
        working-directory: dist
        run: |
          NAME="zero2dev_${VERSION}_windows_amd64"
          cp stage/zero2dev.exe "${NAME}.exe"
          cp ../README.md ../LICENSE ../CHANGELOG.md stage/
          (cd stage && zip -q -9 "../${NAME}.zip" zero2dev.exe README.md LICENSE CHANGELOG.md)
          # `<sha256>  <file>` lines: the format `sha256sum -c` and Get-FileHash users expect,
          # and the same format Zero2Dev's own installer reads.
          sha256sum "${NAME}.zip" "${NAME}.exe" > "zero2dev_${VERSION}_checksums.txt"
          sha256sum -c "zero2dev_${VERSION}_checksums.txt"
          cat "zero2dev_${VERSION}_checksums.txt"
          rm -rf stage

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "$" { on = 1; next }
            /^## / && on      { exit }
            on                { print }
          ' CHANGELOG.md > dist/notes.md
          {
            echo
            echo "### Verify the download"
            echo
            echo 'Windows PowerShell: `Get-FileHash .\zero2dev_'"${VERSION}"'_windows_amd64.zip -Algorithm SHA256`'
            echo "and compare with \`zero2dev_${VERSION}_checksums.txt\`."
            echo
            echo "The executable is not code-signed yet, so Windows SmartScreen or antivirus may warn about it."
            echo "Each file also carries a GitHub build attestation: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
          } >> dist/notes.md

      - name: Attest build provenance
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/zero2dev_*_windows_amd64.zip
            dist/zero2dev_*_windows_amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: zero2dev-${{ env.VERSION }}-windows-amd64
          path: |
            dist/zero2dev_*_windows_amd64.zip
            dist/zero2dev_*_windows_amd64.exe
            dist/zero2dev_*_checksums.txt
            dist/notes.md
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zero2dev-${{ env.VERSION }}-windows-amd64
          path: dist
      - name: Create the tag and the GitHub release
        run: |
          PRERELEASE=""
          [[ "$VERSION" == 0.* || "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          # --target makes gh create the tag v<VERSION> on the commit that was merged and tested.
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            $PRERELEASE \
            --title "Zero2Dev ${VERSION}" \
            --notes-file dist/notes.md \
            "dist/zero2dev_${VERSION}_windows_amd64.zip" \
            "dist/zero2dev_${VERSION}_windows_amd64.exe" \
            "dist/zero2dev_${VERSION}_checksums.txt"
          echo "::notice::Released v${VERSION}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
